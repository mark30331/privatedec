{% extends "base.html" %}

{% block title %}Password Reset | Privatedec{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Reset password</h1>
                <p class="text-secondary">Enter your email and we will send you a reset link.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.email.label_tag }}
                    {{ form.email }}
                    <button type="submit" class="btn btn-primary mt-3">Send reset link</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
